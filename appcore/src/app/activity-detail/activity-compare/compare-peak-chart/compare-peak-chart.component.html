<div>
  <div class="mat-title">
    {{ row.title }} <span class="mat-caption">&nbsp;➔&nbsp;{{ row.sensor.getDisplayUnit(measureSystem, false) }}</span>
  </div>
  <div>
    <plotly-plot *ngIf="chart.data.length > 0"
                 [divId]="chart.id"
                 [data]="chart.data"
                 [layout]="chart.layout"
                 [config]="chart.config"
                 [useResizeHandler]="chart.useResizeHandler"></plotly-plot>
  </div>
</div>
