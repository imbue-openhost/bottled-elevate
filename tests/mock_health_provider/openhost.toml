[app]
name = "mock-health"
version = "0.1.0"
description = "Synthetic health-data provider for elevate tests"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 128
cpu_millicores = 100

[[services.v2.provides]]
service = "github.com/imbue-openhost/health-data-service-spec"
version = "0.1.0"
endpoint = "/api/"
