[app]
name = "elevate"
version = "0.1.0"
description = "Elevate fitness analytics, fed by the OpenHost health-data service"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 256
cpu_millicores = 200

[data]
# Durable store for the app's own data: settings, athlete, computed activities, and streams.
sqlite = ["main"]

[[services.v2.consumes]]
service = "github.com/imbue-openhost/health-data-service-spec"
shortname = "health"
version = ">=0.1.0"
